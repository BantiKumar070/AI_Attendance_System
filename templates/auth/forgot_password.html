{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block guest_content %}
<div class="auth-wrapper">
    <div class="auth-card shadow-lg">
        <div class="text-center mb-4">
            <div class="auth-icon-frame viewfinder">
                <i class="bi bi-key-fill auth-icon"></i>
            </div>
            <h3 class="mt-2 mb-0">Forgot Password</h3>
            <p class="text-muted">Enter your username or email and we'll send you a reset link.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password_page') }}">
            <input type="hidden" name="login_panel" value="{{ login_panel }}">
            <div class="mb-3">
                <label class="form-label">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-send-fill"></i> Send Reset Link
            </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
            <i class="bi bi-info-circle"></i> No email server set up? Ask your super admin to reset your password directly.
        </p>
        <p class="text-center small mt-2 mb-0">
            <a href="{{ url_for('auth.teacher_login_page' if login_panel == 'teacher' else 'auth.login_page') }}">
                <i class="bi bi-arrow-left"></i> Back to login
            </a>
        </p>
    </div>
</div>
{% endblock %}
