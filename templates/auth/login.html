{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block guest_content %}
<div class="auth-wrapper">
    <div class="auth-card shadow-lg">
        <div class="text-center mb-4">
            <div class="auth-icon-frame viewfinder">
                <i class="bi bi-camera-video-fill auth-icon"></i>
            </div>
            <h3 class="mt-2 mb-0">AI Attendance System</h3>
            <p class="text-muted">Admin &amp; Staff Login</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login_page') }}">
            <div class="mb-3">
                <label class="form-label">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="text-end mt-1">
                    <a href="{{ url_for('auth.forgot_password_page', panel='admin') }}" class="small">Forgot password?</a>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
            Are you a teacher? <a href="{{ url_for('auth.teacher_login_page') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
