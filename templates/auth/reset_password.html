{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block guest_content %}
<div class="auth-wrapper">
    <div class="auth-card shadow-lg">
        <div class="text-center mb-4">
            <div class="auth-icon-frame viewfinder">
                <i class="bi bi-shield-lock-fill auth-icon"></i>
            </div>
            <h3 class="mt-2 mb-0">Set a New Password</h3>
            <p class="text-muted">This link expires 30 minutes after it was requested.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.reset_password_page', token=token, panel=login_panel) }}">
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-control" required minlength="8" autofocus>
                <div class="form-text">At least 8 characters, including a letter and a number.</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-save"></i> Reset Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
